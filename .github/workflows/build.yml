name: Fabriquer l'appli

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # image Ubuntu 24.04 : le SDK Android y est déjà installé (licences acceptées)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # clé de signature stable (facultative) : secret BULLE_KEYSTORE_B64 = fichier .jks encodé en base64
      - name: Clé de signature
        env:
          KS: ${{ secrets.BULLE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bulle.jks"
            echo "BULLE_KEYSTORE_FILE=$RUNNER_TEMP/bulle.jks" >> "$GITHUB_ENV"
            echo "Signature avec la clé du dépôt"
          else
            echo "::warning::Pas de clé de signature (secret BULLE_KEYSTORE_B64) : clé de débogage, désinstaller l'ancienne version avant d'installer celle-ci"
          fi

      - name: Fabrication de l'APK
        env:
          BULLE_KEYSTORE_PASSWORD: ${{ secrets.BULLE_KEYSTORE_PASSWORD }}
          BULLE_KEY_ALIAS: ${{ secrets.BULLE_KEY_ALIAS }}
          BULLE_KEY_PASSWORD: ${{ secrets.BULLE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Nom du fichier
        run: cp app/build/outputs/apk/release/app-release.apk Bulle-essai-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bulle-essai-${{ github.run_number }}
          path: Bulle-essai-${{ github.run_number }}.apk

      # version d'essai publiée sur la page « Releases » (téléchargeable depuis le téléphone, sans compte GitHub)
      - name: Publier la version d'essai
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete essai --yes --cleanup-tag || true
          gh release create essai Bulle-essai-${{ github.run_number }}.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Version d'essai n°${{ github.run_number }}" \
            --notes "Dernière version d'essai de l'appli Bulle pour Android. Sur le téléphone : touchez le fichier .apk ci-dessous pour le télécharger, puis ouvrez-le pour l'installer (Android demandera d'autoriser l'installation depuis le navigateur). Si Android refuse d'installer par-dessus l'ancienne version, désinstallez-la d'abord."

  # Essai automatique dans un émulateur Android, contre un vrai serveur Bulle lancé sur la même machine.
  # Les captures d'écran sont jointes à la version d'essai (page Releases) et au résultat de la fabrication.
  essai-emulateur:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Serveur Bulle (dernière version)
        uses: actions/checkout@v5
        with:
          repository: kermess14/bulle
          path: serveur

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bibliothèque d'essai et démarrage du serveur
        run: |
          pip install -q -r serveur/requirements.txt
          python tests/make_library.py "$PWD/biblio"
          cd serveur
          LIBRARY_ROOT="$GITHUB_WORKSPACE/biblio" DATA_DIR="$GITHUB_WORKSPACE/donnees" PORT=2205 HOST=0.0.0.0 \
            nohup python -m bulle.server > "$GITHUB_WORKSPACE/serveur.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:2205/api/stats && break; sleep 1; done

      - uses: actions/download-artifact@v5
        with:
          name: Bulle-essai-${{ github.run_number }}

      - name: Accélération de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Essai dans l'émulateur (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tests/emu_test.py Bulle-essai-${{ github.run_number }}.apk

      - name: Journal du serveur
        if: always()
        run: cp serveur.log screens/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-essai-${{ github.run_number }}
          path: screens/

      - name: Captures jointes à la version d'essai
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screens
          for f in *.png rapport.txt; do [ -f "$f" ] && cp "$f" "essai-$f"; done
          gh release upload essai essai-* --clobber -R "${{ github.repository }}" || true
