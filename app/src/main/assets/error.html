<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="logo"><svg viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="24" fill="#FFD43B"/><path fill="#1A1A1A" d="M57,34 C73,34 84,43 84,55 C84,67 73,76 57,76 C54,76 51,75.6 48.4,74.9 L37,82 L39.6,71.5 C34,67.6 30,61.9 30,55 C30,43 41,34 57,34 Z"/><path fill="#fff" stroke="#1A1A1A" stroke-width="2.6" d="M54,31 C70,31 81,40 81,52 C81,64 70,73 54,73 C51,73 48,72.6 45.4,71.9 L34,79 L36.6,68.5 C31,64.6 27,58.9 27,52 C27,40 38,31 54,31 Z"/><circle cx="42" cy="52" r="4" fill="#E8590C"/><circle cx="54" cy="52" r="4" fill="#E8590C"/><circle cx="66" cy="52" r="4" fill="#E8590C"/></svg><div><h1>BULLE</h1><p>Serveur injoignable</p></div></div>
  <div class="card">
    <h2>Impossible de joindre Bulle</h2>
    <p class="help" id="what">Le serveur ne répond pas.</p>
    <p class="help">Vérifiez que le téléphone est bien sur le Wi-Fi de la maison (ou sur votre VPN) et que le serveur est allumé.</p>
    <button class="primary" id="offline" type="button" hidden>📥 Mes BD hors connexion</button>
    <button class="primary" id="retry" type="button">Réessayer</button>
    <button class="secondary" id="change" type="button">Changer de serveur</button>
  </div>
</main>
<script>
  const app = window.BulleApp;
  if (app) {
    try {
      const f = JSON.parse(app.getFailure());
      const server = (f.server || "").replace(/^http:\/\//, "");
      document.getElementById("what").textContent = "Pas de réponse de " + (server || "votre serveur") + (f.reason ? " (" + f.reason + ")" : "") + ".";
    } catch (e) {}
  }
  document.getElementById("retry").addEventListener("click", () => app && app.retry());
  try {
    const kept = app && app.offlineList ? JSON.parse(app.offlineList()).filter(a => a.done).length : 0;
    if (kept) {
      const b = document.getElementById("offline");
      b.hidden = false;
      b.textContent = "📥 Lire mes BD hors connexion (" + kept + ")";
      b.addEventListener("click", () => app.openOffline());
      document.getElementById("retry").className = "secondary";
    }
  } catch (e) {}
  document.getElementById("change").addEventListener("click", () => app && app.changeServer());
</script>
</body>
</html>
